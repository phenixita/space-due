<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <title>Orbit Quiz — A little space adventure</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f3ff;
      --card: rgba(255, 255, 255, .88);
      --ink: #24213b;
      --muted: #77748d;
      --line: #e8e4f3;
      --accent: #7257e8;
      --accent-dark: #5c43ce;
      --accent-soft: #eeeaff;
      --correct: #18875a;
      --correct-bg: #e8f8ef;
      --wrong: #c94453;
      --wrong-bg: #fff0f0;
      --shadow: 0 24px 70px rgba(53, 39, 106, .12);
      --console-bg: #f8f7ff;
      --console-grid: rgba(114, 87, 232, .055);
      --console-border: #dcd6f2;
      --console-glow: rgba(114, 87, 232, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11101c;
        --card: rgba(29, 27, 44, .94);
        --ink: #f4f1ff;
        --muted: #aaa5c2;
        --line: #39354c;
        --accent: #a593ff;
        --accent-dark: #b4a6ff;
        --accent-soft: #322c50;
        --correct: #67dda0;
        --correct-bg: #183d30;
        --wrong: #ff8791;
        --wrong-bg: #48262e;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
        --console-bg: #191827;
        --console-grid: rgba(165, 147, 255, .07);
        --console-border: #45405f;
        --console-glow: rgba(128, 105, 227, .13);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 12%, rgba(255, 190, 214, .35), transparent 34%),
        radial-gradient(ellipse at 85% 82%, rgba(145, 190, 255, .32), transparent 36%),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 510px);
      position: relative;
      padding: 30px;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      animation: arrive .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #987fff, #f58cbb);
      box-shadow: 0 5px 16px rgba(124, 91, 222, .25);
      font-size: 18px;
    }

    .score {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: color-mix(in srgb, var(--card) 75%, transparent);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .score strong { color: var(--ink); }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8a6af0, #ed83ba);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    .question-area {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin-top: 23px;
      padding: 21px 20px 17px;
      border: 1px solid var(--console-border);
      border-radius: 17px;
      background:
        radial-gradient(ellipse at 100% 0%, var(--console-glow), transparent 44%),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px),
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        var(--console-bg);
      background-size: auto, 22px 22px, 22px 22px, auto;
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 35%, transparent), 0 8px 22px rgba(40, 32, 80, .06);
    }

    .question-area::before,
    .question-area::after {
      position: absolute;
      z-index: -1;
      width: 15px;
      height: 15px;
      border-color: var(--accent);
      border-style: solid;
      content: "";
      opacity: .6;
      pointer-events: none;
    }

    .question-area::before {
      top: 8px;
      left: 8px;
      border-width: 1px 0 0 1px;
      border-radius: 4px 0 0;
    }

    .question-area::after {
      right: 8px;
      bottom: 8px;
      border-width: 0 1px 1px 0;
      border-radius: 0 0 4px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin: 0 0 13px;
      padding: 4px 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
      border-radius: 6px;
      color: var(--accent-dark);
      background: color-mix(in srgb, var(--accent-soft) 74%, transparent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .question-area .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--correct);
      box-shadow: 0 0 9px color-mix(in srgb, var(--correct) 65%, transparent);
      content: "";
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 19px;
      font-size: clamp(21px, 5vw, 26px);
      line-height: 1.3;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 8px;
    }

    .answer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--console-border) 80%, transparent);
      border-radius: 10px;
      color: var(--ink);
      background: color-mix(in srgb, var(--card) 78%, transparent);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 5px 15px rgba(92, 67, 206, .09);
    }

    .answer:focus-visible, .primary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--accent-soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
      animation: pop .35s ease both;
    }

    .answer.correct .answer-letter {
      color: white;
      background: var(--correct);
    }

    .answer.incorrect {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-bg);
      animation: shake .42s ease both;
    }

    .answer.incorrect .answer-letter {
      color: white;
      background: var(--wrong);
    }

    .feedback {
      min-height: 26px;
      margin: 13px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .feedback.good { color: var(--correct); font-weight: 650; }
    .feedback.bad { color: var(--wrong); font-weight: 650; }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding-top: 3px;
    }

    .primary {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, #8062ed, #674bd9);
      box-shadow: 0 8px 18px rgba(104, 76, 218, .22);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(104, 76, 218, .3);
    }

    .primary:active { transform: translateY(0); }

    .result {
      padding: 17px 0 4px;
      text-align: center;
      animation: arrive .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .result-emoji {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border-radius: 32px;
      background: linear-gradient(145deg, var(--accent-soft), color-mix(in srgb, #f8cfe1 42%, var(--card)));
      font-size: 53px;
      animation: float 2.6s ease-in-out infinite;
    }

    .result h1 { margin-bottom: 8px; }
    .result-copy { max-width: 350px; margin: 0 auto 20px; color: var(--muted); }
    .final-score {
      display: inline-block;
      margin-bottom: 23px;
      padding: 8px 15px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      font-weight: 750;
    }

    .missed-review {
      max-width: 430px;
      margin: 0 auto 24px;
      text-align: left;
    }

    .missed-review h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .missed-review ol {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .missed-review li {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: color-mix(in srgb, var(--card) 70%, var(--accent-soft));
    }

    .missed-review h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .missed-review p {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .missed-review .review-fact,
    .review-empty { color: var(--muted); }

    .review-empty { margin: 0; }

    .result .primary { display: block; margin: 0 auto; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-5px); }
      30%, 60%, 90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop {
      0% { transform: scale(.98); }
      55% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .quiz { padding: 23px 19px; border-radius: 22px; }
      .topline { margin-bottom: 20px; }
      .question-area { margin-top: 19px; padding: 19px 15px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-label="Space exploration quiz">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🪐</span> Orbit Quiz</div>
      <div class="score" aria-live="polite">⭐ Score <strong id="score">0</strong></div>
    </header>

    <div id="quiz-content">
      <div class="progress-meta">
        <span id="progress-label">Question 1 of 10</span>
        <span id="progress-percent">10%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <section class="question-area" aria-live="polite">
        <p class="eyebrow" id="category">The solar system</p>
        <h1 id="question"></h1>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="actions">
          <button class="primary" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Mercury", "Jupiter"],
        correct: 1,
        fact: "Mars looks rusty red because its soil contains iron oxide."
      },
      {
        category: "Moon mission",
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
        correct: 2,
        fact: "Neil Armstrong took his first lunar steps on July 20, 1969."
      },
      {
        category: "Our star",
        question: "What is the Sun mostly made of?",
        answers: ["Liquid rock", "Hydrogen and helium", "Oxygen and nitrogen", "Hot metal"],
        correct: 1,
        fact: "The Sun is a giant ball of plasma, mostly hydrogen and helium."
      },
      {
        category: "The solar system",
        question: "Which planet has the most famous ring system?",
        answers: ["Saturn", "Neptune", "Earth", "Mars"],
        correct: 0,
        fact: "Saturn's spectacular rings are made mostly of ice and rocky pieces."
      },
      {
        category: "Deep space",
        question: "What is the name of our galaxy?",
        answers: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"],
        correct: 3,
        fact: "Our solar system lives in the Milky Way, a barred spiral galaxy."
      },
      {
        category: "Moon mission",
        question: "What was the name of the first human-made satellite?",
        answers: ["Voyager 1", "Sputnik 1", "Apollo 11", "Hubble"],
        correct: 1,
        fact: "The Soviet Union launched Sputnik 1 into orbit in 1957."
      },
      {
        category: "The solar system",
        question: "Which planet is the largest in our solar system?",
        answers: ["Saturn", "Earth", "Jupiter", "Uranus"],
        correct: 2,
        fact: "Jupiter is so big that more than 1,300 Earths could fit inside it."
      },
      {
        category: "Space science",
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Friction", "Electricity", "Gravity"],
        correct: 3,
        fact: "The Sun's gravity keeps the planets moving in their orbits."
      },
      {
        category: "Space science",
        question: "What is a light-year a measurement of?",
        answers: ["Distance", "Time", "Brightness", "Speed"],
        correct: 0,
        fact: "A light-year is the distance light travels in one year."
      },
      {
        category: "Deep space",
        question: "Which telescope was launched into space in 1990?",
        answers: ["Kepler Space Telescope", "James Webb Space Telescope", "Hubble Space Telescope", "Chandra X-ray Observatory"],
        correct: 2,
        fact: "The Hubble Space Telescope has been revealing the universe since 1990."
      }
    ];

    let questionNode = document.getElementById("question");
    let answersNode = document.getElementById("answers");
    let categoryNode = document.getElementById("category");
    const scoreNode = document.getElementById("score");
    let progressNode = document.getElementById("progress");
    let progressFill = document.getElementById("progress-fill");
    let progressLabel = document.getElementById("progress-label");
    let progressPercent = document.getElementById("progress-percent");
    let feedbackNode = document.getElementById("feedback");
    let nextButton = document.getElementById("next");
    const contentNode = document.getElementById("quiz-content");
    let current = 0;
    let score = 0;
    let answered = false;
    const missedAnswers = [];

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      categoryNode.textContent = item.category;
      questionNode.textContent = item.question;
      feedbackNode.textContent = "";
      feedbackNode.className = "feedback";
      nextButton.hidden = true;
      nextButton.innerHTML = current === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      answersNode.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        answersNode.append(button);
      });

      const progress = Math.round((current / questions.length) * 100);
      progressFill.style.width = `${Math.max(10, progress)}%`;
      progressNode.setAttribute("aria-valuenow", String(current));
      progressNode.setAttribute("aria-valuemax", String(questions.length));
      progressLabel.textContent = `Question ${current + 1} of ${questions.length}`;
      progressPercent.textContent = `${Math.max(10, progress)}%`;
    }

    function chooseAnswer(index) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answersNode.children];
      buttons.forEach(button => { button.disabled = true; });

      if (index === item.correct) {
        score += 1;
        scoreNode.textContent = String(score);
        buttons[index].classList.add("correct");
        feedbackNode.textContent = `✨ That's right! ${item.fact}`;
        feedbackNode.classList.add("good");
      } else {
        missedAnswers.push({
          question: item.question,
          selectedAnswer: item.answers[index],
          correctAnswer: item.answers[item.correct],
          fact: item.fact
        });
        buttons[index].classList.add("incorrect");
        buttons[item.correct].classList.add("correct");
        feedbackNode.textContent = `Not quite! ${item.fact}`;
        feedbackNode.classList.add("bad");
      }
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      progressFill.style.width = "100%";
      progressNode.setAttribute("aria-valuenow", String(questions.length));
      progressLabel.textContent = "Adventure complete";
      progressPercent.textContent = "100%";
      let emoji, title, copy;
      if (score >= 9) {
        emoji = "🚀"; title = "Out of this world!";
        copy = "You really know your way around the cosmos. Space explorer status: legendary.";
      } else if (score >= 6) {
        emoji = "🌟"; title = "Star explorer!";
        copy = "A brilliant trip through the universe. You've got some serious space smarts.";
      } else if (score >= 3) {
        emoji = "🛸"; title = "Nice journey!";
        copy = "You've got a growing galaxy of knowledge. Ready to discover even more?";
      } else {
        emoji = "🌙"; title = "Curious cosmonaut!";
        copy = "Every great explorer starts somewhere. The universe is full of things to learn!";
      }

      contentNode.innerHTML = `
        <section class="result" aria-live="polite">
          <div class="result-emoji" role="img" aria-label="${emoji}">${emoji}</div>
          <p class="eyebrow">Mission complete</p>
          <h1>${title}</h1>
          <p class="result-copy">${copy}</p>
          <div class="final-score">⭐ You scored ${score} out of ${questions.length}</div>
          <section class="missed-review" aria-labelledby="review-heading">
            <h2 id="review-heading"></h2>
            <div id="review-content"></div>
          </section>
          <button class="primary" id="replay" type="button">Play again <span aria-hidden="true">↻</span></button>
        </section>`;

      const reviewHeading = document.getElementById("review-heading");
      const reviewContent = document.getElementById("review-content");
      if (missedAnswers.length === 0) {
        reviewHeading.textContent = "Perfect score!";
        const message = document.createElement("p");
        message.className = "review-empty";
        message.textContent = "You got every question right. Amazing work!";
        reviewContent.append(message);
      } else {
        reviewHeading.textContent = "Questions to review";
        const list = document.createElement("ol");
        missedAnswers.forEach(missed => {
          const entry = document.createElement("li");
          const question = document.createElement("h3");
          question.textContent = missed.question;
          entry.append(question);

          [["Your answer", missed.selectedAnswer], ["Correct answer", missed.correctAnswer], ["Fact", missed.fact]]
            .forEach(([label, value], index) => {
              const detail = document.createElement("p");
              if (index === 2) detail.className = "review-fact";
              const name = document.createElement("strong");
              name.textContent = `${label}: `;
              detail.append(name, document.createTextNode(value));
              entry.append(detail);
            });
          list.append(entry);
        });
        reviewContent.append(list);
      }

      document.getElementById("replay").addEventListener("click", restart);
      document.getElementById("replay").focus();
    }

    function restart() {
      current = 0;
      score = 0;
      missedAnswers.length = 0;
      scoreNode.textContent = "0";
      contentNode.innerHTML = `
        <div class="progress-meta">
          <span id="progress-label">Question 1 of ${questions.length}</span>
          <span id="progress-percent">10%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="0" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <section class="question-area" aria-live="polite">
          <p class="eyebrow" id="category"></p>
          <h1 id="question"></h1>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
          <div class="actions">
            <button class="primary" id="next" type="button" hidden></button>
          </div>
        </section>`;
      rebindNodes();
      renderQuestion();
      answersNode.firstElementChild.focus();
    }

    function rebindNodes() {
      categoryNode = document.getElementById("category");
      questionNode = document.getElementById("question");
      answersNode = document.getElementById("answers");
      feedbackNode = document.getElementById("feedback");
      nextButton = document.getElementById("next");
      progressNode = document.getElementById("progress");
      progressFill = document.getElementById("progress-fill");
      progressLabel = document.getElementById("progress-label");
      progressPercent = document.getElementById("progress-percent");
      nextButton.addEventListener("click", advance);
    }

    function advance() {
      if (!answered) return;
      current += 1;
      if (current >= questions.length) {
        showResults();
      } else {
        renderQuestion();
        answersNode.firstElementChild.focus();
      }
    }

    nextButton.addEventListener("click", advance);
    renderQuestion();
  </script>
